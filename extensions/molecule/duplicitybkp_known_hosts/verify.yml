---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    known_hosts_path: /root/.ssh/known_hosts
    expected_line: >-
      backup.example ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKnownHostsFixtureOnly
  tasks:
    - name: Read known_hosts
      ansible.builtin.slurp:
        src: "{{ known_hosts_path }}"
      register: known_hosts_file

    - name: Select non-comment lines
      ansible.builtin.set_fact:
        known_hosts_entries: >-
          {{ (known_hosts_file.content | b64decode).splitlines()
             | map('trim')
             | reject('equalto', '')
             | reject('match', '^#')
             | list }}

    - name: Assert exactly one entry with the expected host and key
      ansible.builtin.assert:
        that:
          - known_hosts_entries | length == 1
          - known_hosts_entries[0] == expected_line
        fail_msg: "unexpected known_hosts content: {{ known_hosts_entries }}"

    - name: Stat known_hosts file and directory
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ known_hosts_path }}"
        - "{{ known_hosts_path | dirname }}"
      register: known_hosts_stat

    - name: Assert ownership and modes
      ansible.builtin.assert:
        that:
          - known_hosts_stat.results[0].stat.mode == "0644"
          - known_hosts_stat.results[0].stat.pw_name == "root"
          - known_hosts_stat.results[0].stat.gr_name == "root"
          - known_hosts_stat.results[1].stat.mode == "0700"
          - known_hosts_stat.results[1].stat.pw_name == "root"
          - known_hosts_stat.results[1].stat.gr_name == "root"
