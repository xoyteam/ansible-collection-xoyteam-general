---
# Molecule scenario for xoyteam.general.pgbasebackup_extdkr.
#
# Run from the collection root:
#   python -m pip install -r requirements-molecule.txt
#   molecule test -s pgbasebackup_extdkr
#
# Docker daemon is required on the host (the scenario itself does not need
# Docker inside the instance: verify.yml installs a fake `docker` CLI to test
# the backup script, its lock and metrics without a real PostgreSQL server).
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: pgbasebackup-extdkr
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    # Resolve xoyteam.general.* from the collection checkout, even if the
    # collection is not installed into ansible_collections.
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../.."
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: pgbasebackup_extdkr
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
