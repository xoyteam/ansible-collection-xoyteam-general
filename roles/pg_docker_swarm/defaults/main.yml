---
# PostgreSQL в Docker Swarm: отдельный стек + отдельная attachable overlay-сеть,
# к которой другие стеки подключаются как к external network.
#
# Хост должен быть в Swarm (docker swarm init); роль его не инициализирует.
# По умолчанию порт наружу не публикуется: потребители ходят по имени сервиса
# (postgres) внутри overlay-сети. Для доступа с хоста/извне задайте
# pgdocker_swarm_publish_port.

pgdocker_swarm_stack: pg
pgdocker_swarm_service: postgres
pgdocker_swarm_image: postgres:17
pgdocker_swarm_install_path: "/home/docker/{{ pgdocker_swarm_stack }}"
pgdocker_swarm_data_dir: "{{ pgdocker_swarm_install_path }}/data"
pgdocker_swarm_network: "{{ pgdocker_swarm_stack }}-net"

pgdocker_swarm_db: postgres
pgdocker_swarm_user: postgres

# Секрет суперпользователя. Однотипно с postgres_users:
#   credentials-crypt/<inventory_hostname>/<container_name>_<dbms_name>_<role>
# role — имя роли суперпользователя (pgdocker_swarm_user), для lab2 — postgres.
# Длина >= 20; только буквы и цифры (ascii_letters включает заглавные),
# без спецсимволов. Пароль можно переопределить (например, Bareos передаёт
# свой bareos_catalog_password).
pgdocker_swarm_dbms_name: postgres
pgdocker_swarm_container_name: "{{ pgdocker_swarm_service }}"
pgdocker_swarm_superuser_role: "{{ pgdocker_swarm_user }}"
pgdocker_swarm_credentials_dir: "credentials-crypt/{{ inventory_hostname }}"
pgdocker_swarm_password_length: 32
pgdocker_swarm_password: "{{ lookup('password', pgdocker_swarm_credentials_dir ~ '/' ~ pgdocker_swarm_container_name ~ '_' ~ pgdocker_swarm_dbms_name ~ '_' ~ pgdocker_swarm_superuser_role ~ ' length=' ~ pgdocker_swarm_password_length ~ ' chars=ascii_letters,digits') }}"

# PGDATA внутри контейнера и target bind-mount. Для postgres:18 явно задаём
# /var/lib/postgresql/data: дефолт образа 18 — /var/lib/postgresql/18/docker,
# без этого данные ушли бы мимо bind-mount. Для postgres:17 значение то же.
pgdocker_swarm_pgdata: /var/lib/postgresql/data

# Публикация порта на хост. null/0 — не публиковать (поведение по умолчанию,
# как у Bareos). Для lab2: 5432.
pgdocker_swarm_publish_port: null
pgdocker_swarm_publish_mode: ingress

# Необязательные env контейнера (пусто — не рендерить).
pgdocker_swarm_initdb_args: ""
pgdocker_swarm_timezone: ""

# Настройки PostgreSQL через `postgres -c key=value` (пусто — дефолты образа).
# Пример:
#   pgdocker_swarm_settings:
#     maintenance_work_mem: 2GB
#     max_wal_size: 8GB
#     checkpoint_timeout: 15min
#     wal_compression: "on"
pgdocker_swarm_settings: {}

# uid/gid официального образа postgres (999:999).
pgdocker_swarm_uid: 999
pgdocker_swarm_gid: 999

pgdocker_swarm_replicas: 1

# Дополнительные переменные окружения контейнера (словарь).
pgdocker_swarm_env: {}
