---
- name: require pgbasebackup_extdkr settings
  ansible.builtin.assert:
    that:
      - bkp_name | default('') | length > 0
      - pgextdkr_pgpass | default('') | length > 0
    fail_msg: >-
      bkp_name and pgextdkr_pgpass are required. pgextdkr_pgpass must come from
      vault/secret manager of the consuming project, not from a lookup.
    quiet: true

- name: ensure directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "root"
    group: "root"
  loop:
    - { path: "{{ pgextdkr_bin_path }}", mode: "0700" }
    - { path: "{{ pgextdkr_data_path }}", mode: "0700" }
    - { path: "{{ pgextdkr_log_path }}", mode: "0750" }
    - { path: "{{ pgextdkr_compose_dir }}", mode: "0700" }

- name: ensure node_exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"
  when: node_exporter_textfile_dir | default('') | length > 0

- name: ensure log file exists
  ansible.builtin.file:
    path: "{{ pgextdkr_log_name }}"
    state: touch
    mode: "0640"
    owner: "root"
    group: "root"

- name: render docker compose project
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ pgextdkr_compose_file }}"
    mode: "0600"
    owner: "root"
    group: "root"

- name: render pgpass env file
  ansible.builtin.template:
    src: "pgpass.env.j2"
    dest: "{{ pgextdkr_env_file }}"
    mode: "0600"
    owner: "root"
    group: "root"
  no_log: true

- name: install backup script
  ansible.builtin.template:
    src: "script.sh.j2"
    dest: "{{ pgextdkr_bin_name }}"
    mode: "0700"
    owner: "root"
    group: "root"

- name: check docker daemon availability
  ansible.builtin.command:
    argv: ["{{ pgextdkr_docker_bin }}", "info"]
  register: pgextdkr_docker_info
  changed_when: false
  failed_when: false
  check_mode: false
  when: pgextdkr_effective_image | length > 0

- name: inspect backup image
  ansible.builtin.command:
    argv: ["{{ pgextdkr_docker_bin }}", "image", "inspect", "{{ pgextdkr_effective_image }}"]
  register: pgextdkr_image_check
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - pgextdkr_effective_image | length > 0
    - pgextdkr_docker_info.rc | default(1) == 0

- name: pull backup image when it is missing
  ansible.builtin.command:
    argv: ["{{ pgextdkr_docker_bin }}", "pull", "{{ pgextdkr_effective_image }}"]
  when:
    - pgextdkr_pull_image | bool
    - pgextdkr_effective_image | length > 0
    - pgextdkr_docker_info.rc | default(1) == 0
    - pgextdkr_image_check.rc | default(1) != 0
  changed_when: true

- name: create cron task
  ansible.builtin.cron:
    name: "pg_basebackup docker compose job {{ pgextdkr_jobname }}"
    minute: "{{ pgextdkr_cron_minute }}"
    hour: "{{ pgextdkr_cron_hour }}"
    job: "{{ pgextdkr_bin_name }} >>{{ pgextdkr_log_name }} 2>&1"

- name: logrotate configure
  ansible.builtin.template:
    src: "logrotate.j2"
    dest: "/etc/logrotate.d/{{ pgextdkr_logrotate_name }}"
    mode: "0644"
    owner: "root"
    group: "root"
